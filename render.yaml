services:
  - type: web
    name: reel-pipeline
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: KLING_KEY
        sync: false
      - key: GOOGLE_TTS_KEY
        sync: false
      - key: RITA_TOKEN
        sync: false
